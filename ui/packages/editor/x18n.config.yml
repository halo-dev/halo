# yaml-language-server: $schema=https://x18n.dev/schema/config.json
name: halo-editor
sourceLocale: en
presets:
  - vue-i18n
resources:
  - pattern: src/locales/{locale}.json
keyStyle: nested
usage:
  include:
    - src/**/*.{vue,ts,tsx,js,jsx}
  exclude:
    - "**/node_modules/**"
    - "**/*.d.ts"
    - "**/*.spec.*"
    - "**/*.test.*"
    - "**/__tests__/**"
