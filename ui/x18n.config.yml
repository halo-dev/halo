# yaml-language-server: $schema=https://x18n.dev/schema/config.json
name: halo-ui
sourceLocale: en
presets:
  - vue-i18n
resources:
  - pattern: src/locales/{locale}.json
keyStyle: flat
usage:
  include:
    - src/**/*.{vue,ts,tsx,js,jsx}
    - console-src/**/*.{vue,ts,tsx,js,jsx}
    - uc-src/**/*.{vue,ts,tsx,js,jsx}
    - packages/console-shared/src/**/*.{vue,ts,tsx,js,jsx}
    - packages/shared/src/**/*.{vue,ts,tsx,js,jsx}
    - packages/components/src/**/*.{vue,ts,tsx,js,jsx}
  exclude:
    - "**/node_modules/**"
    - "**/*.d.ts"
    - "**/*.spec.*"
    - "**/*.test.*"
    - "**/__tests__/**"
