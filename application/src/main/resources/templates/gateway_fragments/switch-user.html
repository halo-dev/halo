<form
  th:fragment="form"
  class="halo-form"
  id="switch-user-form"
  name="switch-user-form"
  th:action="${action}"
  method="post"
>
  <div class="user-info" th:object="${user}">
    <img th:if="*{spec.avatar}" th:src="*{spec.avatar}" class="user-avatar" />
    <div class="user-details">
      <span th:text="${exit} ? #{form.currentUser.label} : #{form.targetUser.label}"></span>
      <span class="user-name" th:text="|*{spec.displayName}(@*{metadata.name})|"></span>
    </div>
  </div>
  <div class="form-item">
    <button type="submit" th:text="${exit} ? #{form.submit.exit} : #{form.submit.switch}"></button>
  </div>

  <div class="form-item">
    <a href="javascript:history.back()" class="cancel-link" th:text="#{form.cancel}"> </a>
  </div>
</form>
