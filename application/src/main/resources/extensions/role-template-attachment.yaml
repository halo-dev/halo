apiVersion: v1alpha1
kind: "Role"
metadata:
  name: role-template-manage-attachments
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/dependencies: '[ "role-template-view-attachments" ]'
    rbac.authorization.halo.run/module: "Attachments Management"
    rbac.authorization.halo.run/display-name: "Attachment Manage"
    rbac.authorization.halo.run/ui-permissions: |
      ["system:attachments:manage"]
rules:
  - apiGroups: ["storage.halo.run"]
    resources: ["attachments", "groups"]
    verbs: ["*"]
  # Storage policy settings, including their ConfigMap-backed configuration,
  # are super-admin-only for now. Managers keep read access to resolve policy
  # names in the console.
  # See https://github.com/halo-dev/halo/issues/10477.
  - apiGroups: ["storage.halo.run"]
    resources: ["policies", "policytemplates"]
    verbs: ["get", "list"]
  - apiGroups: ["api.console.halo.run"]
    resources: ["attachments"]
    verbs: ["*"]
  - apiGroups: ["api.console.halo.run"]
    resources: ["attachments/upload-from-url"]
    verbs: ["create"]
  - nonResourceURLs: ["/apis/api.console.halo.run/v1alpha1/attachments/upload"]
    verbs: ["create"]
  - apiGroups: ["console.api.storage.halo.run"]
    resources: ["attachments/upload"]
    verbs: ["create"]
  - apiGroups: ["console.api.storage.halo.run"]
    resources: ["attachments/match-permalinks"]
    verbs: ["create"]
---
apiVersion: v1alpha1
kind: "Role"
metadata:
  name: role-template-view-attachments
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "Attachments Management"
    rbac.authorization.halo.run/display-name: "Attachment View"
    rbac.authorization.halo.run/ui-permissions: |
      ["system:attachments:view"]
rules:
  - apiGroups: ["storage.halo.run"]
    resources: ["attachments", "policies", "policytemplates", "groups"]
    verbs: ["get", "list"]
  - apiGroups: ["api.console.halo.run"]
    resources: ["attachments"]
    verbs: ["get", "list"]
