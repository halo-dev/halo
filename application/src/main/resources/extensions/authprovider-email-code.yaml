apiVersion: auth.halo.run/v1alpha1
kind: AuthProvider
metadata:
  name: email-code
  labels:
    auth.halo.run/auth-binding: "false"
    auth.halo.run/privileged: "false"
spec:
  displayName: Email Code
  description: Sign in with an email verification code.
  logo: /images/login-methods/login-with-email-code.svg
  website: https://www.halo.run
  authenticationUrl: /login/email-code
  method: post
  rememberMeSupport: true
  authType: form
