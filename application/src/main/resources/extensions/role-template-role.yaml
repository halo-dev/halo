apiVersion: v1alpha1
kind: "Role"
# Role management can modify any Role, including roles bound to the caller, so it
# must stay super-admin-only. Retired into a hidden, empty tombstone; keep the
# resources so upgrades overwrite legacy rules. Do not add rules back.
# See https://github.com/halo-dev/halo/issues/10477.
metadata:
  name: role-template-manage-roles
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
rules: []
---
apiVersion: v1alpha1
kind: "Role"
# Retired together with role management. See #10477.
metadata:
  name: role-template-view-roles
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
rules: []
