apiVersion: v1alpha1
kind: "Role"
# Granting roles is already restricted to super administrators on the server;
# this template is retired so permissions cannot be delegated. Retired into a
# hidden, empty tombstone; keep the resources so upgrades overwrite legacy
# rules. Do not add rules back. See https://github.com/halo-dev/halo/issues/10477.
metadata:
  name: role-template-manage-permissions
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
rules: []
---
apiVersion: v1alpha1
kind: "Role"
# Retired together with permission management. See #10477.
metadata:
  name: role-template-view-permissions
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
rules: []
