apiVersion: v1alpha1
kind: "Role"
# Retired into a hidden, empty tombstone: backup/restore exposes all extension data
# and can overwrite the workdir (including plugin jars), so this capability must
# stay super-admin-only. Keep the resource so upgrades overwrite legacy rules;
# do not add rules back. See https://github.com/halo-dev/halo/issues/10477.
metadata:
  name: role-template-manage-migration
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
rules: []
