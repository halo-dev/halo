apiVersion: v1alpha1
kind: "Role"
# ConfigMap holds the system configuration (`system` / `system-default`), plugin
# and theme settings, and storage policy configuration, so read or write access
# is equivalent to full system configuration control and secret access. Keep
# this capability super-admin-only. Retired into a hidden, empty tombstone; keep
# the resource so upgrades overwrite legacy rules. Do not add rules back.
# See https://github.com/halo-dev/halo/issues/10477.
metadata:
  name: role-template-manage-configmaps
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
rules: []
---
apiVersion: v1alpha1
kind: "Role"
# Retired together with ConfigMap read access. See #10477.
metadata:
  name: role-template-view-configmaps
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
rules: []
